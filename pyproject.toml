[project]
name = "shoebox"
version = "1.0.0"
requires-python = ">=3.11"

dependencies = [
    # ── API 
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # ── Data layer 
    "sqlalchemy==2.0.49",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",

    # ── Parsers ───
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.3.0",
    "openpyxl>=3.1.2",

    # ── Frontend ──
    "dash>=2.17.0",
    "dash-bootstrap-components>=1.6.0",
    "plotly>=5.22.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
